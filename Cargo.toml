[workspace]
members = [
    "crates/aac",
    "crates/cli",
    "crates/core",
    "crates/graph",
    "crates/mpegts",
    "crates/nvidia",
    "crates/rtmp",
    "crates/runtime",
    "crates/rtsp",
    "crates/srt",
]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["aimedia contributors"]
repository = "https://github.com/anvsk/aimedia"

[workspace.dependencies]
anyhow = "1.0.98"
async-trait = "0.1.88"
bytes = { version = "1.10.1", features = ["serde"] }
clap = { version = "4.5.40", features = ["derive"] }
futures-util = "0.3.31"
libc = "0.2.174"
libloading = "0.8.8"
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls"] }
retina = { version = "=0.4.19", default-features = false, features = ["h265"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
shiguredo_rtmp = "=2026.1.0-canary.6"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
url = "2.5.4"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"
