apiVersion: aimedia/v1alpha2
kind: MediaJob
metadata:
  name: two-camera-demo

inputs:
  - name: wide
    role: wide
    uri: srt://0.0.0.0:9001
    offsetMs: 0
    secretRef:
      env: AIMEDIA_SRT_WIDE_PASSPHRASE
    srt:
      mode: listener
      latencyMs: 120
      connectTimeoutMs: 3000
      reconnect:
        enabled: true
        initialBackoffMs: 250
        maxBackoffMs: 5000
      keyLength: 16
  - name: close
    role: close
    uri: srt://0.0.0.0:9002
    offsetMs: 35
    secretRef:
      env: AIMEDIA_SRT_CLOSE_PASSPHRASE
    srt:
      mode: listener
      latencyMs: 120
      connectTimeoutMs: 3000
      reconnect:
        enabled: true
        initialBackoffMs: 250
        maxBackoffMs: 5000
      keyLength: 16

processing:
  video:
    width: 1920
    height: 1080
    fps: 30
    bitrateKbps: 6000
    gopMs: 1000
    profile: main
    bFrames: 0
  audio:
    sampleRate: 48000
    channels: 2
    bitrateKbps: 128
  timing:
    masterInput: 0
    bufferMs: 1000
    maxSkewMs: 80
  switching:
    policy:
      minShotMs: 3000
      scoreMargin: 0.15
      candidateHoldMs: 800
      cooldownMs: 2000
    audio:
      targetLufs: -16.0
      crossfadeMs: 80
      truePeakDbfs: -1.0

outputs:
  - name: program
    uri: srt://127.0.0.1:10000
    secretRef:
      env: AIMEDIA_SRT_OUTPUT_PASSPHRASE
    srt:
      mode: caller
      latencyMs: 120
      connectTimeoutMs: 3000
      reconnect:
        enabled: true
        initialBackoffMs: 250
        maxBackoffMs: 5000
      keyLength: 16

taps:
  - name: director-signals
    kind: directorSignals
    fastAnalyzers:
      vad: true
      person: true
      mouthMotion: true
      quality: true
    vlmAdvisor:
      mode: disabled
      model: Qwen3-VL-2B-Instruct
      intervalMs: 2000
      deadlineMs: 800
      validForMs: 3000
      weight: 0.25
      explicitPrivacyConsent: false

failurePolicy:
  failoverOnDisconnect: true
  pauseAutoOnSkew: true
  ignoreVlmFailure: true

control:
  socketPath: /run/aimedia/aimedia.sock
  socketMode: "0660"
