apiVersion: aimedia/v1alpha2
kind: MediaJob
metadata:
  name: rtmp-listener-to-srt

inputs:
  - name: encoder
    role: custom
    uri: rtmp://0.0.0.0:1935/live
    rtmp:
      mode: listen
      streamName: camera
      handshakeTimeoutMs: 5000
      readTimeoutMs: 10000
      maxMessageBytes: 8388608
      reconnect:
        enabled: true
        initialBackoffMs: 250
        maxBackoffMs: 5000

processing:
  video:
    width: 1920
    height: 1080
    fps: 30
    bitrateKbps: 6000
    gopMs: 1000
    profile: main
    bFrames: 0
  audio:
    sampleRate: 48000
    channels: 2
    bitrateKbps: 128
  timing:
    masterInput: 0
    bufferMs: 1000
    maxSkewMs: 80

outputs:
  - name: program
    uri: srt://127.0.0.1:10000
    srt:
      mode: caller
      latencyMs: 120

taps: []
