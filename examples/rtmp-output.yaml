apiVersion: aimedia/v1alpha2
kind: MediaJob
metadata:
  name: srt-to-rtmps-program

inputs:
  - name: contribution
    role: custom
    uri: srt://0.0.0.0:9000
    srt:
      mode: listener
      latencyMs: 120

processing:
  video:
    width: 1920
    height: 1080
    fps: 30
    bitrateKbps: 6000
    gopMs: 1000
    profile: main
    bFrames: 0
  audio:
    sampleRate: 48000
    channels: 2
    bitrateKbps: 128
  timing:
    masterInput: 0
    bufferMs: 1000
    maxSkewMs: 80

outputs:
  - name: program
    # Replace the host and application path; keep the secret out of this URI.
    uri: rtmps://publish.example.test/live
    rtmp:
      mode: publish
      streamNameRef:
        env: AIMEDIA_RTMP_STREAM_NAME
      connectTimeoutMs: 3000
      handshakeTimeoutMs: 5000
      readTimeoutMs: 10000
      maxMessageBytes: 8388608
      reconnect:
        enabled: true
        initialBackoffMs: 250
        maxBackoffMs: 5000

taps: []
