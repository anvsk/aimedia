name: Bug report
description: Report a reproducible defect in a currently implemented capability.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the support matrix first. Planned native media backends are not bugs.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest safe configuration or replay capture that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: aimedia version or commit
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux x86_64
        - Windows development environment
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials, SRT passphrases, tokens, and private media URLs.
