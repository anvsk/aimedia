[package]
name = "aimedia-nvidia"
description = "NVIDIA Video Codec SDK 13.0 boundary and CUDA surface ownership for aimedia"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
build = "build.rs"

[features]
default = []
video-codec-sdk = ["dep:bindgen", "dep:sha2"]

[dependencies]
aimedia-core = { version = "0.1.0-alpha.1", path = "../core" }
libloading.workspace = true
serde.workspace = true
thiserror.workspace = true

[build-dependencies]
bindgen = { version = "0.72.1", optional = true }
sha2 = { version = "0.10.9", optional = true }

[lints]
workspace = true
